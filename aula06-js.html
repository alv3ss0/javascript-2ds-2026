<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <style>
        .grid {
            display: grid;
            grid-template-columns: repeat( auto-fit, minmax(300px, 1fr));
            gap: 10px;
        }

        .item {
            background-color: rgb(253, 4, 207);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 4px;
            justify-content: center;
        }

        .item1 {
            background-color: rgb(253, 4, 207);
            color: white;
            padding: 165px;
            text-align: center;
            border-radius: 1px;
        }
    </style>


    <title>aula06 - GRID CSS responsivot</title>
</head>
<body>
    <div class="grid">
        <div class="item1">item 1</div>
        <div class="item1">item 2</div>
        <div class="item1">item 3</div>
        <div class="item1">item 4</div>
        <div class="item1">item 5</div>
        <div class="item1">item 6</div>
    </div>
</body>
</html>
